<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AI Website Builder</title>
</head>

<body>
    <main class="app">
        <section class="panel">
            <h1>AI Website Builder</h1>
            <p class="subtitle">Paste your API key, describe the website, and preview it instantly.</p>

            <label for="apiEndpoint">API Endpoint</label>
            <input id="apiEndpoint" type="text" value="https://api.openai.com/v1/chat/completions"
                placeholder="https://api.openai.com/v1/chat/completions">

            <label for="model">Model</label>
            <input id="model" type="text" value="gpt-4.1-mini" placeholder="gpt-4.1-mini">

            <label for="apiKey">API Key</label>
            <input id="apiKey" type="password" placeholder="sk-...">

            <label for="prompt">Website Prompt</label>
            <textarea id="prompt" rows="8"
                placeholder="Example: Build a modern landing page for a coffee shop with hero section, menu cards, and contact form."></textarea>

            <button id="generateBtn" type="button">Generate Website</button>
            <p id="status" class="status" aria-live="polite"></p>
        </section>

        <section class="preview">
            <div class="preview-header">
                <h2>Live Preview</h2>
                <div class="preview-actions">
                    <button id="downloadBtn" type="button">Download HTML</button>
                    <button id="openNewTab" type="button">Open in New Tab</button>
                </div>
            </div>
            <iframe id="previewFrame" title="Generated website preview"></iframe>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
